<h1>Decision Reset</h1>
<p id="question">Which mode do you need right now?</p>

<div id="buttons">
  <button onclick="calmMode()">🧠 Calm Mode</button><br><br>
  <button onclick="parentMode()">👨‍👩‍👧 Parent Mode</button><br><br>
  <button onclick="workMode()">💼 Work Mode</button>
</div>

<p id="output"></p>

<p style="margin-top:40px; font-size:14px; color:#666;">
  No accounts. No tracking. Just clarity.
</p>

<script>
  function calmMode() {
    document.getElementById("output").innerHTML = `
      <strong>Pause.</strong><br><br>
      Unclench your jaw.<br>
      Drop your shoulders.<br><br>
      You do not need to solve everything right now.<br><br>
      👉 Pick one tiny next step.
    `;
  }

  function parentMode() {
    document.getElementById("output").innerHTML = `
      <strong>Check basics first:</strong><br><br>
      Are the kids safe? ✔️<br>
      Food, water, rest handled? ✔️<br><br>
      Everything else can wait.<br><br>
      👉 Choose the kindest next action.
    `;
  }

  function workMode() {
    document.getElementById("output").innerHTML = `
      <strong>Focus reset:</strong><br><br>
      What reduces pressure or brings money?<br><br>
      👉 Do that first.<br><br>
      One task. One win.
    `;
  }
</script>
